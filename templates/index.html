<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{url_for('static',filename='favicon.ico')}}">
    <title>Cérémonie du Ballon d'Or 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Cérémonie du Ballon d'Or</h1>
        <audio id="ceremony-music" src="{{ url_for('static', filename='JAWNY-Honeypie.mp3') }}" preload="auto" loop></audio>
        <button id="start-btn">Révéler le Classement</button>
        <a> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></a>


        <div id="ranking-container">
            <!-- La boucle Python/Jinja injecte les joueurs -->
            {% for player in players %}
            <div class="player-card hidden" data-rank="{{ player.rank }}">
                <!-- Rang à gauche -->
                <div class="rank">#{{ player.rank }}</div>
                
                <!-- Image au dessus du nom -->
                <div class="content">
                    <div class="photo-container">
                        <img src="{{ player.image }}" alt="{{ player.name }}" class="player-photo spinning">
                    </div>
                    <div class="info">
                        <h2>{{ player.name }}</h2>
                        <p>{{ player.team }} <br> Score : {{ player.score }} pts</p>
                    </div>
                </div>
            </div>
            {% endfor %}
            <button id="rerun">Recommencer la simulation</button>
            <a href="https://www.flaticon.com/fr/icones-gratuites/ballon-dor" title="ballon d'or icônes">Ballon d'or icônes créées par Magnific - Flaticon</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
